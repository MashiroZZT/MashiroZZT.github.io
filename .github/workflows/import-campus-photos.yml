name: Import licensed campus photos
on:
  push:
    paths:
      - '.github/workflows/import-campus-photos.yml'
      - 'assets/campus-sources.json'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Download and optimize campus photographs
        run: |
          python - <<'PY'
          import base64, io, json, time, urllib.request
          from pathlib import Path
          from PIL import Image
          for item in json.loads(Path('assets/campus-sources.json').read_text()):
              target = Path('assets') / item['file']
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(item['url'], headers={'User-Agent': 'ZitaoZhangPersonalWebsite/1.0 (licensed campus photo attribution; github.com/MashiroZZT/MashiroZZT.github.io)'})
                      with urllib.request.urlopen(request, timeout=45) as response:
                          data = response.read()
                      image = Image.open(io.BytesIO(data)).convert('RGB')
                      image.thumbnail((1600, 1200))
                      image.save(target, 'JPEG', quality=86, optimize=True)
                      target.with_suffix('.jpg.b64').write_text(base64.b64encode(target.read_bytes()).decode('ascii'))
                      print(f"Saved {target}: {image.size}, {target.stat().st_size} bytes")
                      break
                  except Exception:
                      if attempt == 2: raise
                      time.sleep(15)
          PY
      - name: Save public image assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/columbia-campus.jpg assets/uw-campus.jpg assets/*.jpg.b64
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Import optimized Columbia and UW campus photographs"
          git push
